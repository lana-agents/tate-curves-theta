version: "v0.4"

project:
  name: "tate-curves-theta"
  description: >-
    A Lean 4 / Mathlib formalization of Tate curves, q-uniformization and the classical theta
    function over a complete non-archimedean field K. For a Tate parameter q (a unit with ‖q‖ < 1)
    it proves convergence, quasi-periodicity, inversion and the zero divisor of the theta function
    θ, and the Jacobi triple product θ = ∏ unconditionally; the Weierstrass identity for the Tate
    point (X(u), Y(u)) under 12 ≠ 0, the group law and the isomorphism Kˣ/qᶻ ≃* E_q(K) (Silverman,
    Advanced Topics, V.3.1); the j-invariant with ‖j(E_q)‖ = ‖q‖⁻¹, and the characterization of
    the Tate parameter: every j with ‖j‖ > 1 has a unique Tate parameter, whose curve has split
    multiplicative reduction. Normalized orders (IUT I, Def. 3.1(c)) and base change along
    isometric extensions are included.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Advanced Topics in the Arithmetic of Elliptic Curves"
    authors: ["Joseph H. Silverman"]
    type: "book"
    location: "Ch. V (Theorem 3.1, the Tate curve and q-uniformization)"
    relationship: "formalizes"
    note: "The converse V.5.3 (every curve with split multiplicative reduction is some E_q) is not stated."
    author_endorsement: "n/a"
  - title: "The Étale Theta Function and its Frobenioid-theoretic Manifestations"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    location: "Publ. Res. Inst. Math. Sci. 45 (2009); Prop. 1.4 (classical content only)"
    relationship: "adapts"
    note: "Only the classical properties of the theta function are formalized; the anabelian content is out of scope."
    author_endorsement: "not-contacted"
  - title: "A review of non-Archimedean elliptic functions"
    authors: ["John Tate"]
    type: "article"
    location: "Elliptic curves, modular forms, & Fermat's last theorem (Hong Kong, 1993), 162-184"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Inter-universal Teichmüller Theory I"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    location: "Definition 3.1(c) (normalized order of the Tate parameter)"
    relationship: "background"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/lana-agents/formal-schemes"
    relationship: "other"
    note: "Lake dependency only (pinned 51aa935); no file currently imports FormalSchemes."
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Used by: iut pins this repository at ca6c227 to build the local Θ-data at the bad places."

