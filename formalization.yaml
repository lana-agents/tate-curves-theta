  arxiv: ["math.NT", "math.AG"]
  msc2020: ["11G07", "14H52", "11F27", "14G22"]

status:
  scope: >-
    The classical q-uniformization and theta-function package over a complete non-archimedean
    field: theta function and Jacobi triple product, the Tate curve, the isomorphism
    Kˣ/qᶻ ≃* E_q(K), the j-invariant and the characterization of the Tate parameter, split
    multiplicative reduction, normalized orders and isometric base change, and the converse Silverman V.5.3 (every curve with
    ‖j‖ > 1 and square twist invariant -c₄/c₆ is K-isomorphic to a unique E_q, the isomorphism
    unique up to sign; in every residue characteristic the square condition is equivalent to split
    multiplicative reduction and to the tangent quadratic splitting mod 𝔪; in the non-split case
    W is K-isomorphic to the quadratic twist of E_q by γ and isomorphic to E_q over K(√γ)).
    Kummer classes of theta values (continuous-kummer-theory): relations in H¹_cont(G_K, μ_n) and
    H¹_cont(G_K, Ẑ(1)) from the functional equations (q-translates, inversion, the values at
    √q^{2j-1}, which are q^{-j²/2} up to a common factor), restriction to extensions, and the
    comparison of the Kummer class of the germ of θ in K⟦X⟧ with the class of its value on a
    decomposition group (for Ω algebraically closed over K((X)) with no hypotheses on the residue
    field: it is an algebraic closure of K). Not formalized: the Kummer class of the étale theta
    function on a tempered fundamental group (no étale/tempered π₁ of curves in Mathlib), and the
    anabelian content of The Étale Theta Function.
